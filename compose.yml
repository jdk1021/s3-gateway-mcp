services:
  s3-gateway-mcp:
    build: .
    image: s3-gateway-mcp:local
    container_name: s3-gateway-mcp
    restart: unless-stopped
    # upload_file이 호스트 파일을 읽을 수 있도록 호스트 사용자 UID로 실행
    user: "${UID:-1000}:${GID:-1000}"
    env_file: .env
    ports:
      - "127.0.0.1:${S3_MCP_PORT:-18801}:8000"
    volumes:
      # 에이전트가 보는 경로와 같은 경로로 읽기 전용 마운트. ALLOWED_DIRS와 맞춘다.
      # 더 허용하려면 README의 "Local file access" 경고를 먼저 읽는다.
      - /tmp:/tmp:ro
